sensors:
  - overhead_camera
overhead_camera:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/points
  max_range: 0.8
  point_subsample: 1
  padding_offset: 0.01
  padding_scale: 1.0
  max_update_rate: 1.0
  filtered_cloud_topic: filtered_cloud  # Required for RViz visualization (QoS warning is non-critical)
  octomap_resolution: 0.02

