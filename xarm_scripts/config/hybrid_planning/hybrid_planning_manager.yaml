# El "cerebro": mapea eventos a acciones sobre el global y el local planner.
#
#   moveit_hybrid_planning/SinglePlanExecution
#       planifica una vez y ejecuta. Si la trayectoria se invalida, aborta.
#
#   moveit_hybrid_planning/ReplanInvalidatedTrajectory
#       cuando el local planner reporta que la trayectoria dejo de ser valida,
#       vuelve a pedirle un plan al global planner sin parar la ejecucion.
#       Este es el que hace visible el comportamiento reactivo en clase.
# xarm_hybrid_planning/ReplanWhenIdle (paquete xarm_hybrid_planning de este repo)
#   Variante de ReplanInvalidatedTrajectory que arregla las dos cosas que impiden
#   que el ciclo reactivo cierre: no pide un plan global si ya hay uno en vuelo, y
#   no trata como fatal un 'Global planning action aborted'. Corta a los 10
#   reintentos para que la demo termine siempre.
planner_logic_plugin_name: "xarm_hybrid_planning/ReplanWhenIdle"
