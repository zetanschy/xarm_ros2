# Local planner: recorre la trayectoria global en tiempo real y manda comandos
# al controlador. Es el que detecta que la trayectoria dejo de ser valida.
robot_description: "robot_description"

# Trajectory operator: mantiene la trayectoria de referencia y sigue por donde va
# el robot.
#
# NO es el SimpleSampler de MoveIt. Ese arranca cada trayectoria nueva en el
# waypoint 0, que es el estado inicial que uso el GLOBAL PLANNER, no el estado del
# brazo cuando la solucion llega. Si el brazo se movio en el medio -que es lo
# normal- la distancia al waypoint 0 supera la tolerancia, el indice no avanza
# nunca, y el local planner se queda comandando una pose vieja para siempre. Eso
# hacia que el ciclo reactivo fuera bimodal: o cerraba en 3 replanificaciones o
# gastaba los 30 reintentos.
#
# NearestWaypointSampler ancla cada trayectoria nueva en el waypoint mas cercano
# al estado real del brazo. Ver xarm_hybrid_planning/src/nearest_waypoint_sampler.cpp.
trajectory_operator_plugin_name: "xarm_hybrid_planning/NearestWaypointSampler"

# Tolerancia para dar por alcanzado un waypoint (rad, suma L1 sobre las juntas) y
# cuantos ciclos sin avanzar se toleran antes de volver a anclar. A 100 Hz, 100
# ciclos es un segundo.
waypoint_radian_tolerance: 0.2
reanchor_stall_cycles: 100

# Local constraint solver: genera el comando de cada iteracion. ForwardTrajectory
# simplemente reenvia el siguiente waypoint, y con stop_before_collision frena
# antes de chocar en vez de seguir de largo.
local_constraint_solver_plugin_name: "moveit_hybrid_planning/ForwardTrajectory"

# Igual que el demo de MoveIt. El local planner es un lazo de control: a 100 Hz
# el movimiento sale suave y el chequeo de colisiones va lo bastante seguido.
local_planning_frequency: 100.0

global_solution_topic: "global_trajectory"

# A donde van los comandos: al JointGroupPositionController que spawnea
# hybrid_planning_xarm6.launch.py, NO al xarm6_traj_controller.
#
# El local planner escribe una posicion articular por ciclo. Un
# JointTrajectoryController espera trayectorias e interpola solo; mandarle una
# trayectoria de un punto 50 veces por segundo lo hace reiniciar sin parar, la
# ejecucion se atrasa y termina violando tolerancias, con el brazo clavado contra
# sus limites. Ver config/hybrid_planning/xarm6_position_controller.yaml.
local_solution_topic: "/xarm6_joint_group_position_controller/commands"
local_solution_topic_type: "std_msgs/Float64MultiArray"
publish_joint_positions: true
publish_joint_velocities: false

group_name: "xarm6"

# De aqui saca el mundo. Apunta al scene de move_group para ver los mismos
# objetos que RViz y que el script del demo agrega.
monitored_planning_scene: "/monitored_planning_scene"
collision_object_topic: "/collision_object"
joint_states_topic: "/joint_states"

# Parametro de ForwardTrajectory: detenerse antes de entrar en colision.
stop_before_collision: true
